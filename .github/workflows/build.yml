name: Build ShieldScan APK

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" || true
          sdkmanager --list_installed || true

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating wrapper..."
            gradle wrapper --gradle-version 8.7 || \
            (curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp && /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7)
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --info || gradle assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: |
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace || echo "Release build skipped"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldScan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldScan-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create APK summary
        run: |
          echo "### 📦 APKs Built" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          ls -lh app/build/outputs/apk/release/ 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
